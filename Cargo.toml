[workspace]
members = ["core"]

[workspace.package]
version = "0.0.7"
edition = "2024"
authors = ["powerbq"]
license = "MIT"

[workspace.dependencies]
eso_addons_manager_core = { path = "core" }

[package]
name = "eso-addons-manager"
description = "Addon manager for The Elder Scrolls Online"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
eso_addons_manager_core.workspace = true
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland", "image-without-codecs", "svg", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
litehtml = { version = "0.2.6", features = ["pixbuf"] }
lucide-icons = "1.73"
open = "5"
rfd = "0.18"
rust-embed = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "tracing-log"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1

[build-dependencies]
allsorts = "0.17"
lucide-icons = "1.73"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
section = "games"
priority = "optional"
depends = "$auto"
extended-description = "Browse, install and update add-ons for The Elder Scrolls Online."
assets = [
    ["target/packaging/app", "usr/bin/eso-addons-manager", "755"],
    ["assets/linux/eso-addons-manager.desktop", "usr/share/applications/eso-addons-manager.desktop", "644"],
    ["icons/eso-addons-manager.png", "usr/share/icons/hicolor/256x256/apps/eso-addons-manager.png", "644"],
    ["LICENSE", "usr/share/doc/eso-addons-manager/LICENSE", "644"],
]

[package.metadata.generate-rpm]
auto-req = "builtin"
assets = [
    { source = "target/packaging/app", dest = "/usr/bin/eso-addons-manager", mode = "755" },
    { source = "assets/linux/eso-addons-manager.desktop", dest = "/usr/share/applications/eso-addons-manager.desktop", mode = "644" },
    { source = "icons/eso-addons-manager.png", dest = "/usr/share/icons/hicolor/256x256/apps/eso-addons-manager.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/eso-addons-manager/LICENSE", mode = "644" },
]
