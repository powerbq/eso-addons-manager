[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["powerbq"]
license = "MIT"

[workspace.dependencies]
eso_addons_manager_core = { path = "core" }

[package]
name = "eso-addons-manager"
description = "Addon manager for The Elder Scrolls Online"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
eso_addons_manager_core.workspace = true
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland", "image-without-codecs", "svg", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
litehtml = { version = "0.2.6", features = ["pixbuf"] }
lucide-icons = "1.73"
open = "5"
rfd = "0.18"
rust-embed = "8"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1

[build-dependencies]
allsorts = "0.17"
lucide-icons = "1.73"
