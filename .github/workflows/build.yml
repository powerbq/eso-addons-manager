name: Build

on:
  push:
    tags:
      - current
      - testing

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: eso-addons-manager-windows-amd64.zip
          - os: ubuntu-22.04
            asset: eso-addons-manager-linux-amd64.zip
          - os: macos-latest
            asset: eso-addons-manager-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (Linux, macOS)
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File patches\cargo-patched.ps1 test --workspace
      - name: Build and package (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'testing' }}
          make_latest: ${{ github.ref_name == 'current' }}
          files: |
            target/dist/${{ matrix.asset }}
            target/dist/${{ matrix.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
