[package]
name = "eso_addons_manager_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
encoding_rs = "0.8"
md-5 = "0.11"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target."cfg(windows)".dependencies]
codepage = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
